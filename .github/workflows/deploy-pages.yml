name: Deploy Hebrew Presentation to GitHub Pages

on:
  push:
    branches: [claude/hebrew-rtl-presentation-app-cgtl94]
    paths: ['hebrew-presentation/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hebrew-presentation/package-lock.json

      - name: Install dependencies
        working-directory: hebrew-presentation
        run: npm ci

      - name: Build
        working-directory: hebrew-presentation
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: hebrew-presentation/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
